#debug:disable_logs = false

# program preferences
$terminal = uwsm app -- kitty.desktop
$filemanager = uwsm app -- thunar.desktop
$menu = rofi -show drun -run-command "uwsm app -- {cmd}"
# $menu = /home/aron/.config/rofi/launchers/colorful/launcher.sh
$webbrowser = uwsm app -- firefox.desktop
$emailclient = uwsm app -- org.mozilla.Thunderbird.desktop
$statusbar = systemctl --user enable --now waybar.service  # for uwsm


# Execute on opening
exec-once = swww-daemon & disown && sleep 0.5 && swww img /home/aron/Pictures/02_wallhaven_arch.jpg
# exec-once = swww img /home/aron/Pictures/02_wallhaven_arch.jpg
exec-once = $statusbar
exec-once = systemctl --user enable --now NetworkManager.serice
exec-once = blueman-applet  # bluetooth tray icon
exec-once = nm-applet  # network tray icon
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] $webbrowser
exec-once = [workspace 3 silent] $emailclient
exec-once = [workspace 9 silent] uwsm app -- bitwarden.desktop

# Execute on every reload
exec = systemctl --user start hypr-display-switcher.service

################################################################################
### LOOK AND FEEL
################################################################################

general {
    gaps_in = 2
    gaps_out = 2

    border_size = 4

    col.active_border = rgba(e0d4dfee) rgba(7f6994ee) 45deg
    col.inactive_border = rgba(ae9cbcff)

    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    # inactive_opacity = 0.6  # we set the opacity using a negative regex later on.
}

animations {
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
    force_split = 2  # always split to the right
}

master {
    new_status = master  # TODO do I want this?
}

################################################################################
### MISCELANEOUS
################################################################################
misc {
    disable_hyprland_logo = true
    focus_on_activate = true
}

################################################################################
### INPUT
################################################################################

# https://wiki.hyprland.org/Configuring/Variables/#input
# see also /usr//usr/share/X11/xkb/rules/base.lst for available layouts/variants/options
input {
    kb_layout = us,us
    kb_variant = altgr-intl,intl
    kb_model =
    kb_options = compose:rctrl,
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1  # move focus by hovering

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}


################################################################################
### KEYBINDINGS
################################################################################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER_L # Sets "Windows" key as main modifier

# Locking
bind = $mainMod Alt, L, exec, /home/aron/scripts/swaylock.sh
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod Alt, RETURN, exec, [float; size 1000 560] $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $filemanager

# When toggling to floating, resize and move to center
bind = $mainMod, V, exec, hyprctl dispatch togglefloating && if [[ $(hyprctl activewindow -j | rg -o -P "(?<=\"floating\": )(true|false)") == "true" ]]; then hyprctl dispatch resizeactive exact 1000 560; fi && hyprctl dispatch centerwindow

bindr = $mainMod, SUPER_L , exec, pkill rofi || $menu  # bind on release
bind = $mainMod, P, pseudo,  # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod, O, togglesplit,  # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Regain ALT+TAB functionality
bind = ALT, Tab, cyclenext,

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch to next/prev workspace
bind = $mainMod Shift, Left, workspace, m-1
bind = $mainMod Shift, Right, workspace, m+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, S, movetoworkspace, special

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Swap window in the given direction
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

# Screenshots
bind = $mainMod SHIFT, Print, exec, grim "$(xdg-user-dir PICTURES)/screenshots/$(date -Iseconds).png"
bind = $mainMod, Print, exec, grim -g "$(slurp)" "$(xdg-user-dir PICTURES)/screenshots/$(date -Iseconds).png"

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Waybar
bind = $mainMod SHIFT, w, exec, if systemctl --user --quiet is-active waybar.service; then systemctl --user stop waybar.service; else systemctl --user start waybar.service; fi  # toggle waybar

# mouse movements
bindm = $mainMod, mouse:272, resizewindow
bindm = ALT, mouse:272, movewindow

# keyboard layout
bind = $mainMod, space, exec, hyprctl switchxkblayout current next

################################################################################
### WINDOWS AND WORKSPACES
################################################################################

# Set the opacity for inactive windows, with the exception of 
# -   blueman-manager
# -   org.pulsaudio.pavucontrol
windowrulev2 = opacity 1.0 0.6, class:negative:^(blueman-manager)|(org.pulseaudio.pavucontrol)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Fix IDEA blur/opaque/shadow/...
windowrulev2 = noblur, class:^(jetbrains-idea)$
windowrulev2 = noshadow, class:^(jetbrains-idea)$
windowrulev2 = immediate, class:^(jetbrains-idea)$
windowrulev2 = opaque, class:^(jetbrains-idea)$

# pavucontrol as a widget
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = move onscreen 100% 0%,class:^(org.pulseaudio.pavucontrol)$
# windowrulev2 = maxsize 600 400,class:^(org.pulseaudio.pavucontrol)$

windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = move onscreen 100% 0%,class:^(blueman-manager)$
# windowrulev2 = maxsize 600 400,class:^(blueman-manager)$

# Environment values (needed for at least OBS)
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

################################################################################
### Always Floating
################################################################################
windowrulev2 = float,class:^(org.gnome.Loupe)$
windowrulev2 = float,class:^(thunar)$
windowrulev2 = size 1000 560,class:^(thunar)$
windowrulev2 = float,class:^(org.kde.ark)$

# screenkey
windowrulev2 = float,class:^(one.alynx.showmethekey)$
windowrulev2 = float,class:^(showmethekey-gtk)$
windowrulev2 = pin,class:^(showmethekey-gtk)$

